name: 'build-test'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # yarn.lock is the lockfile dist/ was built from; --frozen-lockfile refuses any drift.
      - run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts
      - run: npx tsc && npm run package
      - name: dist/ is exactly what the source builds to
        run: git diff --exit-code -- dist
      - run: npm test
  test: # make sure the action works on a clean machine without building
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          dry_run: ci
          email: foo@bar
          api_token: xxx
          subdomain: foobar
          jira_project: PROJ
          release_name: name
          